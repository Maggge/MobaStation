name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

#the release job attaches the firmware files to the GitHub release of a tag v*
permissions:
  contents: write

env:
  #arduino-cli looks for libraries in directories.user, sketches are compiled from the workspace
  ARDUINO_DIRECTORIES_DATA: ${{ github.workspace }}/arduino
  ARDUINO_DIRECTORIES_USER: ${{ github.workspace }}/arduino

jobs:
  host-tests:
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      #protocol, ESP link codec and the Mega side of the ESP link against stubs, only g++ needed
      - name: Run host tests
        run: make test

  esp-firmware:
    name: ESP8266 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/bin" sh
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install ESP8266 core and libraries
        run: make esp-setup

      - name: Compile
        run: make esp-build

      - name: Firmware file
        run: cp build/MobaStationESP-esp/MobaStationESP.ino.bin MobaStation-ESP8266.bin

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-esp
          path: MobaStation-ESP8266.bin

  mega:
    name: Mega (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [release, debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/bin" sh
          echo "$HOME/bin" >> "$GITHUB_PATH"

      #make setup installs the AVR core and the libraries and clones DCC and MobaBus next to the repo
      - name: Install platform and libraries
        run: make setup DCC_DIR=$RUNNER_TEMP/DCC MOBABUS_DIR=$RUNNER_TEMP/MobaBus

      - name: Compile
        run: |
          make build DCC_DIR=$RUNNER_TEMP/DCC MOBABUS_DIR=$RUNNER_TEMP/MobaBus \
            EXTRA_FLAGS="${{ matrix.build_type == 'debug' && '-DDEBUG' || '' }}"

      - name: Firmware file
        if: matrix.build_type == 'release'
        run: cp build/MobaStationESP/MobaStationESP.ino.hex MobaStation-Mega.hex

      - uses: actions/upload-artifact@v7
        if: matrix.build_type == 'release'
        with:
          name: firmware-mega
          path: MobaStation-Mega.hex

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, esp-firmware, mega]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Firmware for the standard build: Arduino Mega 2560 + Arduino Motor Shield + ESP8266.

            | File | For |
            |---|---|
            | `MobaStation-Mega.hex` | Arduino Mega 2560, also the Mega of a Mega + WiFi R3 board |
            | `MobaStation-ESP8266.bin` | ESP8266 with 4 MB flash: Mega + WiFi R3 board, Wemos D1 mini, NodeMCU |

            Always flash both files of one release, the Mega and the ESP need the same version.
            How to flash both: [README, Flashing](https://github.com/Maggge/MobaStation#flashing).
            After the first start the station opens the WiFi access point "MobaStation" (password "MobaStation"),
            everything else is set up in the web interface at http://192.168.0.111.
          files: |
            MobaStation-Mega.hex
            MobaStation-ESP8266.bin
